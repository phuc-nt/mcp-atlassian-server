version: '3.8'

services:
  mcp-atlassian-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-atlassian-server
    ports:
      - "3000:3000"
    environment:
      # Atlassian Configuration
      - ATLASSIAN_URL=${ATLASSIAN_URL:-https://your-instance.atlassian.net}
      - ATLASSIAN_EMAIL=${ATLASSIAN_EMAIL:-your-email@example.com}
      - ATLASSIAN_API_TOKEN=${ATLASSIAN_API_TOKEN:-your-api-token}
      - CONFLUENCE_SPACE_KEY=${CONFLUENCE_SPACE_KEY:-}
      
      # Server Configuration
      - NODE_ENV=production
      - PORT=3000
    
    # Restart policy
    restart: unless-stopped
    
    # Health check
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Security
    security_opt:
      - no-new-privileges:true
    
    # Resource limits (optional)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1'
    #       memory: 512M
    #     reservations:
    #       cpus: '0.5'
    #       memory: 256M

  # Optional: Add a reverse proxy (nginx) if you need HTTP routing
  # nginx:
  #   image: nginx:alpine
  #   container_name: mcp-atlassian-server-proxy
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./certs:/etc/nginx/certs:ro
  #   depends_on:
  #     - mcp-atlassian-server
  #   restart: unless-stopped